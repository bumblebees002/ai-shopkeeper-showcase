<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160" role="img" aria-label="AI Shopkeeper">
<style>
.bg{fill:#0f172a}.t{font:700 34px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f8fafc}
.s{font:400 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#94a3b8}
.b{fill:#1e293b;stroke:#334155}.m{font:500 14px ui-monospace,Menlo,monospace;fill:#e2e8f0}
.c{fill:#10b981}.ct{font:600 13px system-ui,sans-serif;fill:#052e1c}
.a1{opacity:0;animation:f 6s infinite}.a2{opacity:0;animation:f 6s 1.2s infinite}
@keyframes f{0%{opacity:0;transform:translateY(6px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
</style>
<rect class="bg" width="800" height="160" rx="14"/>
<text class="t" x="36" y="68">AI Shopkeeper</text>
<text class="s" x="36" y="98">Chat-first inventory, sales and profit for a small shop</text>
<g class="a1"><rect class="b" x="480" y="30" width="270" height="40" rx="10"/><text class="m" x="498" y="56">cashier: 2 coke, 1 bread</text></g>
<g class="a2"><rect class="c" x="560" y="84" width="190" height="40" rx="10"/><text class="ct" x="578" y="109">Save · Edit · Cancel</text></g>
</svg>
